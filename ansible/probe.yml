# Prompt 03, case P25: an encrypt/decrypt round trip through
# ansible.builtin.uri with no_log, then a failing no_log task. make probe
# greps the whole output for probe_marker: it must never appear.
- name: Probe Ansible against the scratch transit mount
  hosts: localhost
  gather_facts: false
  vars:
    probe_token: "{{ lookup('ansible.builtin.file', vgov_tokens_dir + '/probe') }}"
    probe_context: "{{ 'lantern' | ansible.builtin.b64encode }}"
  tasks:
    - name: Encrypt the marker
      ansible.builtin.uri:
        url: "{{ vgov_cluster_addr }}/v1/probe-transit/encrypt/probe-clues"
        ca_path: "{{ vgov_ca }}"
        method: POST
        headers:
          X-Vault-Token: "{{ probe_token }}"
        body_format: json
        body:
          plaintext: "{{ probe_marker | ansible.builtin.b64encode }}"
          context: "{{ probe_context }}"
      register: probe_enc
      no_log: true

    - name: Decrypt it again
      ansible.builtin.uri:
        url: "{{ vgov_cluster_addr }}/v1/probe-transit/decrypt/probe-clues"
        ca_path: "{{ vgov_ca }}"
        method: POST
        headers:
          X-Vault-Token: "{{ probe_token }}"
        body_format: json
        body:
          ciphertext: "{{ probe_enc.json.data.ciphertext }}"
          context: "{{ probe_context }}"
      register: probe_dec
      no_log: true

    - name: The round trip returns the marker
      ansible.builtin.assert:
        that: probe_dec.json.data.plaintext | ansible.builtin.b64decode == probe_marker
        quiet: true
      no_log: true

    - name: A failing request that carries the marker (wrong context)
      ansible.builtin.uri:
        url: "{{ vgov_cluster_addr }}/v1/probe-transit/decrypt/probe-clues"
        ca_path: "{{ vgov_ca }}"
        method: POST
        headers:
          X-Vault-Token: "{{ probe_token }}"
        body_format: json
        body:
          ciphertext: "{{ probe_enc.json.data.ciphertext }}"
          context: "{{ probe_marker | ansible.builtin.b64encode }}"
      register: probe_fail
      failed_when: probe_fail.status != 400
      no_log: true
