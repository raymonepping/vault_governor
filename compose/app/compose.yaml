# compose/app/compose.yaml: the governor console (prompts 06, 07).
#
#   volume-init  one-shot: the web certificate for nginx (uid 101)
#   api          the Node BFF: the console token (D14), the SCIM token (D13),
#                the stage hands' passwords (D11), the three audit logs
#   web          nginx over TLS 1.3; React console + /api proxy
#
# Every credential is a read-only bind mount of one file that Ansible writes
# in place (gotcha 4). Images: make app-build.

services:
  volume-init:
    image: ${ALPINE_IMAGE}
    container_name: vgov-volume_init
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -m 0750 -o 101 -g 101 /web-tls &&
        install -m 0644 -o 101 -g 101 /src/vault.crt /web-tls/web.crt &&
        install -m 0600 -o 101 -g 101 /src/vault.key /web-tls/web.key &&
        install -m 0644 -o 101 -g 101 /src/ca-chain.pem /web-tls/ca-chain.pem &&
        echo '[volume-init] done'
    volumes:
      - web-tls:/web-tls
      - ../../vault-tls:/src:ro
    restart: "no"

  api:
    image: ${VGOV_IMAGE_PREFIX}/api:${VGOV_IMAGE_TAG}
    container_name: vgov-api
    hostname: api
    # gid 1000 reads the three audit logs (0640).
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: "3000"
      VAULT_NODES: https://vault-1:8200,https://vault-2:8200,https://vault-3:8200
      VGOV_NAMESPACE: ${VGOV_NAMESPACE}
      CONSOLE_TOKEN_FILE: /run/secrets/vault/console
      SCIM_TOKEN_FILE: /run/secrets/vault/scim-hr
      PEOPLE_DIR: /run/secrets/people
      AUDIT_LOGS: vault-1=/audit/vault-1/audit.log,vault-2=/audit/vault-2/audit.log,vault-3=/audit/vault-3/audit.log
      BUILD_DIR: /build
      SESSION_IDLE_SECONDS: "${VGOV_SESSION_IDLE}"
      CONSOLE_URL: https://localhost:${VGOV_PORT_WEB}
      VAULT_UI_URL: https://localhost:${VGOV_PORT_VAULT_1}
      NODE_EXTRA_CA_CERTS: /etc/vgov/ca-chain.pem
    ports: ["127.0.0.1:${VGOV_PORT_API}:3000"]
    volumes:
      - ../../vault-tls/ca-chain.pem:/etc/vgov/ca-chain.pem:ro
      - ../../.secrets/vault/tokens/console:/run/secrets/vault/console:ro   # D14
      - ../../.secrets/vault/tokens/scim-hr:/run/secrets/vault/scim-hr:ro   # D13
      # D11, the stage-hand shortcut: the four people the presenter plays.
      # rowan (the presenter) signs in on the form; his password is not here.
      - ../../.secrets/people/ines:/run/secrets/people/ines:ro
      - ../../.secrets/people/kofi:/run/secrets/people/kofi:ro
      - ../../.secrets/people/mara:/run/secrets/people/mara:ro
      - ../../.secrets/people/jonas:/run/secrets/people/jonas:ro
      - ../../.build:/build:ro                      # stage/, layers.json, convergence.json
      - vault-1-audit:/audit/vault-1:ro             # the ledger, one file per node
      - vault-2-audit:/audit/vault-2:ro
      - vault-3-audit:/audit/vault-3:ro
    mem_limit: 256m
    networks: [default]
    restart: unless-stopped

  web:
    image: ${VGOV_IMAGE_PREFIX}/web:${VGOV_IMAGE_TAG}
    container_name: vgov-web
    hostname: web
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports: ["127.0.0.1:${VGOV_PORT_WEB}:8443"]
    volumes:
      - web-tls:/etc/nginx/tls:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  default:
    name: vgov-internal
    external: true

volumes:
  web-tls: {}
  vault-1-audit:
    external: true
    name: vgov-vault_vault-1-audit
  vault-2-audit:
    external: true
    name: vgov-vault_vault-2-audit
  vault-3-audit:
    external: true
    name: vgov-vault_vault-3-audit
