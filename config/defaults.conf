# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. scripts/common.sh,
# scripts/ports-check.sh and e2e/helpers/env.ts read the same names.
# Dependabot cannot parse this file: bump images here by hand, then run
# make verify, make rehearsal and make probe.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# In no sibling lab's defaults.conf and not listening on 2026-11-11.
VGOV_PORT_VAULT_S=19400
VGOV_PORT_VAULT_1=19401
VGOV_PORT_VAULT_2=19402
VGOV_PORT_VAULT_3=19403
VGOV_PORT_API=13900
VGOV_PORT_WEB=13901

# ── Vault ─────────────────────────────────────────────────────────────────────
# Every object of the story lives in this namespace (D9).
VGOV_NAMESPACE=governor

# ── Console ───────────────────────────────────────────────────────────────────
VGOV_WEB_CN=governor.localhost

# ── Story timing (D10) ────────────────────────────────────────────────────────
# Control Group max_ttl: how long a held request waits for its approvals.
VGOV_COUNCIL_TTL=900
# How long the presenter stays signed in to the console without a click.
VGOV_SESSION_IDLE=14400

# ── Application images (make app-build) ───────────────────────────────────────
VGOV_IMAGE_PREFIX=localhost/vault-governor
VGOV_IMAGE_TAG=local
